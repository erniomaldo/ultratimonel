<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ULTRATIMONEL — Gestor de Misiones</title>

  <!-- NES.css v2.3.0 — pixel-art aesthetic -->
  <link rel="stylesheet" href="https://unpkg.com/nes.css@2.3.0/css/nes.min.css">
  <!-- Google Font for brand title only -->
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

  <style>
    /* ════════════════════════════════════════════
       PHASE 1: Layout — sticky header/sidebar + scrollable content
       PHASE 2: Theme tokens (light default, dark toggle)
       PHASE 3+: Custom overrides only
       ════════════════════════════════════════════ */

    * { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── Theme tokens ─────────────── */
    :root {
      --bg-primary: #ffffff;
      --bg-sidebar: #f0f0f0;
      --text-primary: #212529;
      --text-secondary: #636e72;
      --accent: #209cee;
      --border: #d3d3d3;
      /* Semantic colors */
      --success: #27ae60;
      --warning: #f39c12;
      --error: #e94560;
    }

    [data-theme="dark"] {
      --bg-primary: #1a1a2e;
      --bg-sidebar: #16213e;
      --text-primary: #e0e0e0;
      --text-secondary: #7f8c8d;
      --accent: #e94560;
      --border: #0f3460;
      /* Semantic colors */
      --success: #2ecc71;
      --warning: #f1c40f;
      --error: #ff6b6b;
    }

    body {
      background: var(--bg-primary);
      color: var(--text-primary);
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    a { text-decoration: none; }

    /* ── Sticky header ────────────── */
    .header {
      background: var(--bg-sidebar);
      border-bottom: 4px solid var(--border);
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-title {
      font-family: 'Press Start 2P';
    }
    .header-subtitle {
      display: none;
    }

    /* ── Layout — flex with sticky sidebar ─── */
    .app-layout {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ── Sticky sidebar ───────────── */
    .sidebar {
      width: 340px;
      background: var(--bg-sidebar);
      border-right: 4px solid var(--border);
      overflow-y: auto;
      flex-shrink: 0;
    }

    .sidebar-title {
      color: var(--text-secondary);
      padding: 8px 16px;
      letter-spacing: 1px;
      text-transform: uppercase;
      border-bottom: 2px solid var(--border);
      margin-bottom: 4px;
      position: sticky;
      top: 0;
      z-index: 2;
      background: var(--bg-sidebar);
    }

    .project-item {
      padding: 10px 16px;
      cursor: pointer;
      border-left: 4px solid transparent;
      transition: all 0.15s;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .project-item:hover {
      background: color-mix(in srgb, var(--bg-primary) 85%, var(--bg-sidebar));
      border-left-color: var(--error);
    }

    .project-item.active {
      background: color-mix(in srgb, var(--bg-primary) 85%, var(--bg-sidebar));
      border-left-color: var(--error);
      color: var(--error);
    }

    .project-item .badge {
      background: var(--error);
      color: #fff;
      padding: 1px 6px;
      margin-left: auto;
    }

    /* ── Scrollable content ───────── */
    .content {
      flex: 1;
      overflow-y: auto;
    }

    .content-header {
      color: var(--error);
      padding: 20px 20px 8px;
      border-bottom: 2px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 4px;
      position: sticky;
      top: 0;
      z-index: 2;
      background: var(--bg-primary);
    }

    .content-header .top-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .content-header .sub {
      color: var(--text-secondary);
    }

    #mission-list {
      padding: 16px 20px 20px;
    }

    #mission-list .nes-container:not(:last-child) {
      margin-bottom: 24px;
    }

    .breadcrumb {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
    }

    .breadcrumb-link {
      cursor: pointer;
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    .breadcrumb > span:not(:last-child)::after,
    .breadcrumb-link::after {
      content: '›';
      margin-left: 4px;
    }
    .breadcrumb > span:last-child::after,
    .breadcrumb-current::after {
      content: '';
    }

    .back-btn {
      cursor: pointer;
      margin-bottom: 8px;
      display: inline-block;
    }

    /* ── Progress row ──────────────── */
    .progress-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 4px;
    }

    /* Semantic progress accent colors */
    .progress-success { accent-color: var(--success); }
    .progress-warning { accent-color: var(--warning); }
    .progress-error   { accent-color: var(--error); }

    .mission-meta,
    .intento-meta {
      margin-top: 6px;
    }

    /* ── Empty state ───────────────── */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
    }
    .empty-state h3 {
      margin-bottom: 8px;
    }

    /* ── Detail Overlay / Panel ────── */
    .detail-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.8);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .detail-overlay.open {
      display: flex;
    }

    .detail-panel {
      background: var(--bg-primary);
      border: 4px solid var(--border);
      width: 90%;
      max-width: 700px;
      max-height: 85vh;
      overflow-y: auto;
      padding: 24px;
    }

    .detail-panel .close-btn {
      float: right;
      cursor: pointer;
    }

    .detail-section-title {
      margin: 16px 0 8px;
      border-bottom: 1px solid var(--border);
    }

    /* ── Gate row ──────────────────── */
    .gate-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 0;
      border-bottom: 1px solid var(--border);
    }
    .gate-row:last-child {
      border-bottom: none;
    }

    .gate-name {
      font-weight: bold;
      width: 40px;
    }
    .gate-state {
      width: 50px;
    }
    .gate-msg {
      flex: 1;
    }

    /* ── Semantic gate state colors via CSS vars ─── */
    .gate-pass   {}
    .gate-warn   {}
    .gate-block  {}
    .gate-skip   {}


    /* ── Intento Card ──────────────── */
    .intento-card {
      background: var(--bg-sidebar);
      border: 3px solid var(--border);
      padding: 12px 14px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .intento-card:hover {
      border-color: var(--error);
      transform: translateX(2px);
    }
    .intento-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
    }

    /* ── Intento Context (detail view) */
    .intento-context {
      background: var(--bg-sidebar);
      border: 2px solid var(--border);
      padding: 12px;
      margin-bottom: 12px;
    }

    /* ── Gate log button ──────────── */
    .gate-log-btn {
      background: var(--bg-primary);
      border: 1px solid var(--border);
      cursor: pointer;
      padding: 2px 6px;
    }

    /* ── Log row ───────────────────── */
    .log-row {
      padding: 3px 0;
    }

    /* ── Responsive ────────────────── */
    @media (max-width: 640px) {
      .sidebar {
        width: 240px;
      }
      .content {
        padding: 12px;
      }
    }
  </style>
</head>
<body>

  <!-- ═══ HEADER ═════════════════════════════════════════════════ -->
  <header class="header">
    <div>
      <i class="nes-icon trophy is-small"></i>
      <span class="header-title"><span class="crystal">ULTRATIMONEL</span></span>
      <div class="header-subtitle">GESTOR DE MISIONES</div>
    </div>
    <div style="display:flex;align-items:center;gap:10px;">
      <span id="db-status" style="color:var(--text-secondary);">Cargando...</span>
      <!-- Phase 2: Theme toggle checkbox -->
      <label style="display:flex;align-items:center;gap:4px;color:var(--text-secondary);cursor:pointer;">
        Tema
        <input type="checkbox" class="nes-checkbox" id="theme-toggle">
      </label>
    </div>
  </header>

  <!-- ═══ LAYOUT ══════════════════════════════════════════════════ -->
  <div class="app-layout">

    <!-- ── Sidebar ──────────────────────────────────────────────── -->
    <nav class="sidebar" id="sidebar">
      <div class="sidebar-title">Proyectos</div>
      <div id="project-list"></div>
    </nav>

    <!-- ── Content ──────────────────────────────────────────────── -->
    <main class="content" id="content">
      <div class="content-header">
        <div class="top-row">
          <span id="content-title">Selecciona un proyecto</span>
          <span class="sub" id="content-subtitle"></span>
        </div>
        <div class="breadcrumb" id="content-breadcrumb"></div>
      </div>
      <div id="mission-list"></div>
    </main>

  </div>

  <!-- ═══ DETAIL OVERLAY ══════════════════════════════════════════ -->
  <div class="detail-overlay" id="detail-overlay">
    <div class="detail-panel" id="detail-panel">
      <span class="close-btn" id="detail-close">X CERRAR</span>
      <div id="detail-content"></div>
    </div>
  </div>

  <script src="/static/app.js?v=3"></script>

</body>
</html>
